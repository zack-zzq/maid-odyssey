name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        id: version
        run: |
          tag="${{ github.event.release.tag_name }}"
          echo "mod_version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --warning-mode=none -Pmod_version="${{ steps.version.outputs.mod_version }}"
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false

      - name: Upload jar to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          jars=(build/libs/*.jar)
          upload=()
          for jar in "${jars[@]}"; do
            name="$(basename "$jar")"
            case "$name" in
              *-sources.jar|*-dev.jar|*-slim.jar) continue ;;
            esac
            upload+=("$jar")
          done
          if [ "${#upload[@]}" -eq 0 ]; then
            echo "No mod jar found in build/libs" >&2
            ls -la build/libs || true
            exit 1
          fi
          gh release upload "${{ github.event.release.tag_name }}" "${upload[@]}" --clobber
