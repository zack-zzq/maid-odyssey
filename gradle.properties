# ForgeGradle downloads the Mojang jars with plain URL streams that have no timeout, so the
# sun.net.client.* defaults are what stop a stalled connection from hanging the build forever.
org.gradle.jvmargs=-Xmx3G -Dsun.net.client.defaultConnectTimeout=30000 -Dsun.net.client.defaultReadTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.repository.max.retries=5
org.gradle.parallel=false

# Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.3.0
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# Mod metadata
mod_id=maid_odyssey
mod_name=Maid Odyssey
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.zackzzq.maidodyssey
mod_authors=zack-zzq
mod_description=Touhou Little Maid x GregTech Odyssey compatibility: maids clean muffler hatch ash and repair maintenance hatches.

# Dependencies
tlm_version=1.5.3-forge+mc1.20.1
